<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Protocore — иммутабельный цикл оркестрации">
  <defs>
    <linearGradient id="brand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="safety" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="optim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Section title -->
  <text x="640" y="36" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="2">ИММУТАБЕЛЬНЫЙ ЦИКЛ ОРКЕСТРАЦИИ</text>
  <text x="640" y="60" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">три бюджета · graceful degradation · никогда не теряет уже собранные данные</text>

  <!-- Pipeline (left to right) -->
  <!-- Each stage: 180w x 88h pill -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">

    <!-- 1. Request -->
    <g transform="translate(40, 130)">
      <rect width="160" height="92" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="80" y="34" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">ВХОД</text>
      <text x="80" y="58" font-size="14" font-weight="700" fill="#e5e7eb" text-anchor="middle">Запрос</text>
      <text x="80" y="76" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">+ конфиг + навыки</text>
    </g>

    <!-- 2. LLM -->
    <g transform="translate(240, 130)">
      <rect width="160" height="92" rx="14" fill="url(#brand2)" fill-opacity="0.12" stroke="url(#brand2)" stroke-width="2"/>
      <text x="80" y="34" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">ЦИКЛ</text>
      <text x="80" y="58" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">LLM Call</text>
      <text x="80" y="76" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">KV-cache · −10×</text>
    </g>

    <!-- 3. Dispatch -->
    <g transform="translate(440, 130)">
      <rect width="160" height="92" rx="14" fill="url(#brand2)" fill-opacity="0.12" stroke="url(#brand2)" stroke-width="2"/>
      <text x="80" y="34" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">ЦИКЛ</text>
      <text x="80" y="58" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">Dispatch</text>
      <text x="80" y="76" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">tool · subagent · skill</text>
    </g>

    <!-- 4. Safety/Approval -->
    <g transform="translate(640, 130)">
      <rect width="160" height="92" rx="14" fill="url(#safety)" fill-opacity="0.10" stroke="url(#safety)" stroke-width="2"/>
      <text x="80" y="34" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="1">SAFETY</text>
      <text x="80" y="58" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">Approval Gate</text>
      <text x="80" y="76" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">policy · risk · 2FA</text>
    </g>

    <!-- 5. Execute -->
    <g transform="translate(840, 130)">
      <rect width="160" height="92" rx="14" fill="url(#brand2)" fill-opacity="0.12" stroke="url(#brand2)" stroke-width="2"/>
      <text x="80" y="34" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">ЦИКЛ</text>
      <text x="80" y="58" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">Execute</text>
      <text x="80" y="76" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">sandbox · worktree</text>
    </g>

    <!-- 6. Compression -->
    <g transform="translate(1040, 130)">
      <rect width="200" height="92" rx="14" fill="url(#optim)" fill-opacity="0.10" stroke="url(#optim)" stroke-width="2"/>
      <text x="100" y="34" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">OPTIMIZATION</text>
      <text x="100" y="58" font-size="14" font-weight="700" fill="#c4b5fd" text-anchor="middle">3-Layer Compression</text>
      <text x="100" y="76" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">+ identity reinjection</text>
    </g>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="200" y1="176" x2="240" y2="176" marker-end="url(#arrow)"/>
    <line x1="400" y1="176" x2="440" y2="176" marker-end="url(#arrow)"/>
    <line x1="600" y1="176" x2="640" y2="176" marker-end="url(#arrow)"/>
    <line x1="800" y1="176" x2="840" y2="176" marker-end="url(#arrow)"/>
    <line x1="1000" y1="176" x2="1040" y2="176" marker-end="url(#arrow)"/>
  </g>

  <!-- Loop-back arrow (bottom) -->
  <path d="M 1140 222 L 1140 280 L 320 280 L 320 222"
        fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4"
        marker-end="url(#arrowAccent)"/>
  <text x="730" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">есть ещё действия? → следующая итерация</text>

  <!-- Side guards (below) -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">
    <!-- Hallucination override -->
    <g transform="translate(40, 320)">
      <circle cx="14" cy="14" r="6" fill="#10b981"/>
      <text x="32" y="12" fill="#e5e7eb">Hallucination Override</text>
      <text x="32" y="28" fill="#94a3b8" font-weight="500">переопределение ложных ответов</text>
    </g>
    <g transform="translate(280, 320)">
      <circle cx="14" cy="14" r="6" fill="#f59e0b"/>
      <text x="32" y="12" fill="#e5e7eb">Failure Classification</text>
      <text x="32" y="28" fill="#94a3b8" font-weight="500">7 категорий + ResultSalvage</text>
    </g>
    <g transform="translate(520, 320)">
      <circle cx="14" cy="14" r="6" fill="#06b6d4"/>
      <text x="32" y="12" fill="#e5e7eb">Progressive Tools</text>
      <text x="32" y="28" fill="#94a3b8" font-weight="500">BM25 · −40% токенов</text>
    </g>
    <g transform="translate(760, 320)">
      <circle cx="14" cy="14" r="6" fill="#8b5cf6"/>
      <text x="32" y="12" fill="#e5e7eb">Collapse + Drift</text>
      <text x="32" y="28" fill="#94a3b8" font-weight="500">−15..20% зацикливания</text>
    </g>
    <g transform="translate(1000, 320)">
      <circle cx="14" cy="14" r="6" fill="#ef4444"/>
      <text x="32" y="12" fill="#e5e7eb">Circuit Breaker</text>
      <text x="32" y="28" fill="#94a3b8" font-weight="500">LLM-диагностика сбоев</text>
    </g>
  </g>

  <!-- bottom rule -->
  <line x1="40" y1="386" x2="1240" y2="386" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1"/>
  <text x="40" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94a3b8" fill-opacity="0.7">19 hooks (pluggy) · 30+ Protocols · 85+ Event types · 100+ RuntimeConstants (live-tunable)</text>
</svg>
