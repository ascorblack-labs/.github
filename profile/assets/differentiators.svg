<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" role="img" aria-label="Protocore — 9 архитектурных решений">
  <title>Protocore — что отличает: 9 архитектурных решений</title>
  <desc>Сетка 3×3: tool-result consistency, KV-cache, multi-agent modes, failure classification, approval gates, collapse detection, compression, adaptive steering, background tasks.</desc>

  <style>
    .t { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .title { font-size: 17px; font-weight: 700; }
    .body  { font-size: 13px; font-weight: 400; fill: #94a3b8; }
  </style>

  <!-- =========================================================
       CARD 1 — Tool-result consistency check (emerald)
       ========================================================= -->
  <g transform="translate(20,20)" class="t">
    <rect width="400" height="230" rx="14" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#10b981" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L21 6 v6 c0 5 -4 9 -9 11 c-5 -2 -9 -6 -9 -11 v-6 z"/>
        <polyline points="8 12 11 15 16 9"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#10b981">Tool-result consistency check</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">Сверка заявленных моделью результатов</tspan>
      <tspan x="24" dy="20">с фактическими ответами инструментов.</tspan>
      <tspan x="24" dy="20">Не доверяет тексту LLM — снижает</tspan>
      <tspan x="24" dy="20">риск галлюцинаций архитектурно.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#10b981"/>
  </g>

  <!-- =========================================================
       CARD 2 — KV-Cache + Progressive Tools (cyan)
       ========================================================= -->
  <g transform="translate(440,20)" class="t">
    <rect width="400" height="230" rx="14" fill="#06b6d4" fill-opacity="0.04" stroke="#06b6d4" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#06b6d4" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 L22 7 L12 12 L2 7 z"/>
        <polyline points="2 12 12 17 22 12"/>
        <polyline points="2 17 12 22 22 17"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#06b6d4">KV-Cache + Progressive Tools</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">Неизменные части запроса всегда первыми,</tspan>
      <tspan x="24" dy="20">BM25-retrieval подгружает только нужные</tspan>
      <tspan x="24" dy="20">схемы. До 10× дешевле на повторных</tspan>
      <tspan x="24" dy="20">запросах, −40% токенов на инструментах.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#06b6d4"/>
  </g>

  <!-- =========================================================
       CARD 3 — 6 режимов мульти-агентности (purple)
       ========================================================= -->
  <g transform="translate(860,20)" class="t">
    <rect width="400" height="230" rx="14" fill="#8b5cf6" fill-opacity="0.04" stroke="#8b5cf6" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#8b5cf6" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="2.4" fill="#8b5cf6"/>
        <circle cx="5" cy="19" r="2.4"/>
        <circle cx="19" cy="19" r="2.4"/>
        <line x1="11" y1="7" x2="6" y2="17"/>
        <line x1="13" y1="7" x2="18" y2="17"/>
        <line x1="7" y1="19" x2="17" y2="19"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#8b5cf6">6 режимов мульти-агентности</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">LEADER · AUTO_SELECT · PARALLEL ·</tspan>
      <tspan x="24" dy="20">TOOL_ORCHESTRATED · CLI_NATIVE · BYPASS.</tspan>
      <tspan x="24" dy="20">Worktree-изоляция параллельных копий,</tspan>
      <tspan x="24" dy="20">общий scratchpad, ConflictDetector.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#8b5cf6"/>
  </g>

  <!-- =========================================================
       CARD 4 — Structured Failure Classification (amber)
       ========================================================= -->
  <g transform="translate(20,270)" class="t">
    <rect width="400" height="230" rx="14" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#f59e0b" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="4" r="2" fill="#f59e0b"/>
        <line x1="12" y1="6" x2="12" y2="11"/>
        <line x1="12" y1="11" x2="5" y2="16"/>
        <line x1="12" y1="11" x2="12" y2="16"/>
        <line x1="12" y1="11" x2="19" y2="16"/>
        <circle cx="5" cy="18" r="2" fill="#f59e0b"/>
        <circle cx="12" cy="18" r="2" fill="#f59e0b"/>
        <circle cx="19" cy="18" r="2" fill="#f59e0b"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#f59e0b">Structured Failure Classification</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">7 категорий ошибок (TRANSIENT, POLICY,</tspan>
      <tspan x="24" dy="20">AMBIGUITY, EXHAUSTION, UNVERIFIED…) —</tspan>
      <tspan x="24" dy="20">каждая со своей стратегией. ResultSalvage</tspan>
      <tspan x="24" dy="20">извлекает данные даже из сбоев.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#f59e0b"/>
  </g>

  <!-- =========================================================
       CARD 5 — Approval Gates + Risk Scoring (red)
       ========================================================= -->
  <g transform="translate(440,270)" class="t">
    <rect width="400" height="230" rx="14" fill="#ef4444" fill-opacity="0.04" stroke="#ef4444" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#ef4444" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M7 11 V8 a5 5 0 0 1 10 0 V11"/>
        <circle cx="12" cy="16" r="1.2" fill="#ef4444"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#ef4444">Approval Gates + Risk Scoring</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">DefaultShellSafetyPolicy (~25 deny-паттернов),</tspan>
      <tspan x="24" dy="20">WorkspaceApprovalPolicy per operation class,</tspan>
      <tspan x="24" dy="20">risk scoring (5 уровней), 2FA для деструктивных,</tspan>
      <tspan x="24" dy="20">санитизация секретов до того, как LLM их увидит.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#ef4444"/>
  </g>

  <!-- =========================================================
       CARD 6 — Collapse + Drift Detection (emerald)
       ========================================================= -->
  <g transform="translate(860,270)" class="t">
    <rect width="400" height="230" rx="14" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#10b981" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 L22 20 L2 20 z"/>
        <line x1="12" y1="9" x2="12" y2="14"/>
        <circle cx="12" cy="17" r="0.9" fill="#10b981"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#10b981">Collapse + Drift Detection</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">CollapseDetector по Jaccard-похожести</tspan>
      <tspan x="24" dy="20">разрушает паттерн рандомизацией</tspan>
      <tspan x="24" dy="20">формата результатов: −15..20% зацикливания.</tspan>
      <tspan x="24" dy="20">DriftDetector ловит уход от задачи.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#10b981"/>
  </g>

  <!-- =========================================================
       CARD 7 — 3-Layer Compression + Identity Reinjection (cyan)
       ========================================================= -->
  <g transform="translate(20,520)" class="t">
    <rect width="400" height="230" rx="14" fill="#06b6d4" fill-opacity="0.04" stroke="#06b6d4" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#06b6d4" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 8 8 12 4 16"/>
        <polyline points="20 8 16 12 20 16"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="3" y1="3" x2="6" y2="6"/>
        <line x1="21" y1="3" x2="18" y2="6"/>
        <line x1="3" y1="21" x2="6" y2="18"/>
        <line x1="21" y1="21" x2="18" y2="18"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#06b6d4">3-Layer Compression + Identity Reinjection</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">micro_compact → auto_compact →</tspan>
      <tspan x="24" dy="20">manual_compact. Аварийный сжим при</tspan>
      <tspan x="24" dy="20">ContextWindowExceededError с</tspan>
      <tspan x="24" dy="20">восстановлением личности агента.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#06b6d4"/>
  </g>

  <!-- =========================================================
       CARD 8 — Adaptive Runtime Steering (purple)
       ========================================================= -->
  <g transform="translate(440,520)" class="t">
    <rect width="400" height="230" rx="14" fill="#8b5cf6" fill-opacity="0.04" stroke="#8b5cf6" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#8b5cf6" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 14 a9 9 0 0 1 18 0"/>
        <line x1="12" y1="14" x2="17" y2="9"/>
        <circle cx="12" cy="14" r="1.6" fill="#8b5cf6"/>
        <line x1="3" y1="14" x2="5" y2="14"/>
        <line x1="19" y1="14" x2="21" y2="14"/>
        <line x1="12" y1="5" x2="12" y2="7"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#8b5cf6">Adaptive Runtime Steering</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">ExecutionStateInjector показывает</tspan>
      <tspan x="24" dy="20">остаток бюджета. RuntimeInvariant</tspan>
      <tspan x="24" dy="20">проверяет контракты. 100+ параметров</tspan>
      <tspan x="24" dy="20">(RuntimeConstants) меняются на лету.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#8b5cf6"/>
  </g>

  <!-- =========================================================
       CARD 9 — Background Tasks + Forced Finalization (amber)
       ========================================================= -->
  <g transform="translate(860,520)" class="t">
    <rect width="400" height="230" rx="14" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-opacity="0.32" stroke-width="1.5"/>
    <g transform="translate(24,24)">
      <rect width="48" height="48" rx="12" fill="#f59e0b" fill-opacity="0.16"/>
      <g transform="translate(12,12)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 6 12 12 16 14"/>
      </g>
    </g>
    <text x="24" y="106" class="title" fill="#f59e0b">Background Tasks + Forced Finalization</text>
    <text x="24" y="138" class="body">
      <tspan x="24" dy="0">Долгая операция не блокирует цикл —</tspan>
      <tspan x="24" dy="20">результат доставляется перед следующим</tspan>
      <tspan x="24" dy="20">решением. При исчерпании бюджета —</tspan>
      <tspan x="24" dy="20">финальный LLM-вызов без инструментов.</tspan>
    </text>
    <rect x="24" y="208" width="60" height="2" rx="1" fill="#f59e0b"/>
  </g>

</svg>
